name: 'Publish APT package'
description: 'Sign a .deb with GPG and publish it into a reprepro apt repository'

inputs:
  deb:
    description: Path to the built .deb package
    required: true
  repo_dir:
    description: reprepro repository root directory on the runner
    required: true
  conf_dir:
    description: Path to the directory containing this project's repo-conf/distributions
    required: true
  package:
    description: reprepro package/codename (matches Codename in repo-conf/distributions)
    required: true
  gpg_key:
    description: GPG signing key id/fingerprint
    required: true
  install_html:
    description: Optional path to an install.html to publish as the repo's index.html
    required: false
    default: ''
  cleanup_docker:
    description: Run `docker system prune -a -f` after publishing
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Sign and publish to reprepro
      shell: bash
      env:
        DEB: ${{ inputs.deb }}
        REPO_DIR: ${{ inputs.repo_dir }}
        CONF_DIR: ${{ inputs.conf_dir }}
        PACKAGE: ${{ inputs.package }}
        GPG_KEY: ${{ inputs.gpg_key }}
        INSTALL_HTML: ${{ inputs.install_html }}
        CLEANUP_DOCKER: ${{ inputs.cleanup_docker }}
      run: "${{ github.action_path }}/../../scripts/publish-apt.sh"
