name: Publish APT package (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: Human-readable project name (for logs)
        required: true
        type: string
      package:
        description: the package the .deb carries; the reprepro codename too, unless codename is set
        required: true
        type: string
      codename:
        description: reprepro distribution (Codename in repo-conf/distributions) when it is not named like the package - a package published into another project's repository root
        required: false
        type: string
        default: ''
      repo_dir:
        description: reprepro repository root on the runner
        required: true
        type: string
      build_script:
        description: Shell command (run from the caller repo root) that builds the .deb and writes `deb=<path>` to $GITHUB_OUTPUT - and, for the other forms, `rpm=<path>`, `tgz=<path>`, `version=<x.y.z>` and `docker_tags=<tags>`
        required: false
        type: string
        default: ./build.sh
      conf_dir:
        description: Path, relative to the caller repo root, to the dir holding repo-conf/distributions
        required: false
        type: string
        default: ./repo-conf
      install_html:
        description: Path, relative to the caller repo root, to install.html
        required: false
        type: string
        default: ./install.html
      cleanup_docker:
        description: Run `docker system prune -a -f` after publishing
        required: false
        type: boolean
        default: false
      runner:
        description: JSON runs-on value (labels array, or {group, labels} object)
        required: false
        type: string
        default: '{"group":"Default","labels":["self-hosted"]}'
      yum_subdir:
        description: the yum repository under repo_dir an `rpm=` of the build goes into
        required: false
        type: string
        default: yum/el9
      pak_name:
        description: publish the build's `tgz=` (with its `version=`) into repo_dir/paks under this name; empty publishes no tarball
        required: false
        type: string
        default: ''
      docker_image:
        description: push the build's `docker_tags=` of this image (built and checked by build_script) to Docker Hub; empty pushes none
        required: false
        type: string
        default: ''
      docker_host:
        description: the docker host build_script built the image on (ssh:// or tcp://); empty is the runner's own daemon
        required: false
        type: string
        default: ''
      docker_description:
        description: the image repository's one-line description on Docker Hub
        required: false
        type: string
        default: ''
      docker_readme:
        description: Path, relative to the caller repo root, to the Markdown page of the image repository on Docker Hub
        required: false
        type: string
        default: ''
    secrets:
      gpg_key:
        required: true
      docker_token:
        description: a Docker Hub access token with write access to docker_image
        required: false

jobs:
  build-and-publish:
    runs-on: ${{ fromJson(inputs.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # before anything is built or published: an image to push needs its token, or
      # the deb, rpm and tarball would go out and the run fail at the image
      - name: Check the secrets the inputs need
        if: ${{ inputs.docker_image != '' }}
        shell: bash
        env:
          DOCKER_TOKEN: ${{ secrets.docker_token }}
        run: |
          [ -n "$DOCKER_TOKEN" ] || { echo "ERROR: docker_image is ${{ inputs.docker_image }}, and the secret docker_token is empty - nothing built, nothing published" >&2; exit 1; }

      - name: Check disk space by infra
        id: disk_before
        shell: bash
        run: |
          DISK_PATH="${{ runner.tool_cache }}"
          [ -d "$DISK_PATH" ] || DISK_PATH="$HOME"
          echo "Available space before run:"
          df -h "$DISK_PATH"
          used_mb=$(df --output=used -BM "$DISK_PATH" | tail -1 | tr -dc '0-9')
          echo "used_mb=$used_mb" >> "$GITHUB_OUTPUT"

      - name: Build package (inputs.build_script)
        id: build
        shell: bash
        env:
          DOCKER_HOST: ${{ inputs.docker_host }}
        run: |
          [ -n "$DOCKER_HOST" ] || unset DOCKER_HOST
          ${{ inputs.build_script }}

      - name: "Publish to apt repo (publish-apt.sh: gpg&reprepo)"
        uses: DBinvent/infra_apt/actions/publish-deb@v5
        with:
          deb: ${{ steps.build.outputs.deb }}
          repo_dir: ${{ inputs.repo_dir }}
          conf_dir: ${{ inputs.conf_dir }}
          package: ${{ inputs.package }}
          codename: ${{ inputs.codename }}
          gpg_key: ${{ secrets.gpg_key }}
          install_html: ${{ inputs.install_html }}

      - name: "Publish to yum repo (publish-rpm.sh: rpmsign&createrepo)"
        if: ${{ steps.build.outputs.rpm != '' }}
        uses: DBinvent/infra_apt/actions/publish-rpm@v5
        with:
          rpm: ${{ steps.build.outputs.rpm }}
          repo_dir: ${{ inputs.repo_dir }}
          package: ${{ inputs.package }}
          yum_subdir: ${{ inputs.yum_subdir }}
          gpg_key: ${{ secrets.gpg_key }}

      - name: "Publish the tarball to paks/ (publish-pak.sh)"
        if: ${{ inputs.pak_name != '' }}
        uses: DBinvent/infra_apt/actions/publish-pak@v5
        with:
          tgz: ${{ steps.build.outputs.tgz }}
          name: ${{ inputs.pak_name }}
          version: ${{ steps.build.outputs.version }}
          repo_dir: ${{ inputs.repo_dir }}
          gpg_key: ${{ secrets.gpg_key }}

      - name: "Push the image to Docker Hub (publish-docker.sh)"
        if: ${{ inputs.docker_image != '' }}
        uses: DBinvent/infra_apt/actions/publish-docker@v5
        with:
          image: ${{ inputs.docker_image }}
          tags: ${{ steps.build.outputs.docker_tags }}
          docker_host: ${{ inputs.docker_host }}
          description: ${{ inputs.docker_description }}
          readme: ${{ inputs.docker_readme }}
          docker_token: ${{ secrets.docker_token }}

      - name: Cleanup docker
        if: ${{ inputs.cleanup_docker }}
        shell: bash
        run: docker system prune -a -f

      - name: Check disk space after run
        if: always()
        shell: bash
        run: |
          DISK_PATH="${{ runner.tool_cache }}"
          [ -d "$DISK_PATH" ] || DISK_PATH="$HOME"
          echo "Available space after run:"
          df -h "$DISK_PATH"
          used_mb=$(df --output=used -BM "$DISK_PATH" | tail -1 | tr -dc '0-9')
          before_mb=${{ steps.disk_before.outputs.used_mb || 0 }}
          echo "Disk usage increased by $((used_mb - before_mb)) MB during this run"
